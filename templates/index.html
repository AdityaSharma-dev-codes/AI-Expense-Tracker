<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <h1><i class="fas fa-wallet"></i> AI Expense Tracker</h1>

    <div class="card">
        <h3><i class="fas fa-plus-circle"></i> Add New Expense</h3>
        <div class="form-group">
            <input type="number" id="amount" placeholder="Amount (e.g. 50)">
            <input type="text" id="description" placeholder="Description (e.g. Lunch)">
            <select id="category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Groceries">Groceries</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <button onclick="addExpense()" class="btn-primary">Add Expense</button>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-robot"></i> Ask AI Assistant</h3>
        <div class="ai-group">
            <input type="text" id="question" placeholder="How much did I spend on food?">
            <button onclick="askAI()" class="btn-secondary">Ask</button>
        </div>
        <div id="aiAnswer" class="ai-response"></div>
    </div>

    <div class="card">
        <h3><i class="fas fa-list"></i> Recent Expenses</h3>
        <div class="table-container">
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function addExpense() {
    const amount = document.getElementById("amount").value;
    const description = document.getElementById("description").value;
    const category = document.getElementById("category").value;

    if (!amount || !description) {
        alert("Please fill in both amount and description");
        return;
    }

    const res = await fetch("/add_expense", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({amount, description, category})
    });

    const data = await res.json();
    if (data.error) {
        alert("Error: " + data.error);
    } else {
        // Clear inputs
        document.getElementById("amount").value = "";
        document.getElementById("description").value = "";
        loadExpenses();
    }
}

async function loadExpenses() {
    const res = await fetch("/get_expenses");
    const data = await res.json();

    const tbody = document.querySelector("#expenseTable tbody");
    tbody.innerHTML = "";

    data.forEach(exp => {
        let date = 'N/A';
        if (exp.date) {
            // SQLite TIMESTAMP DEFAULT CURRENT_TIMESTAMP is in UTC 'YYYY-MM-DD HH:MM:SS'
            // We can replace the space with 'T' to make it ISO format for better parsing
            date = new Date(exp.date.replace(' ', 'T') + 'Z').toLocaleDateString();
        }
        const row = `
        <tr>
            <td>${date}</td>
            <td class="amount">$${parseFloat(exp.amount).toFixed(2)}</td>
            <td><span class="category-badge ${exp.category.toLowerCase()}">${exp.category}</span></td>
            <td>${exp.description}</td>
            <td>
                <button onclick="deleteExpense(${exp.id})" class="btn-delete">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

async function deleteExpense(id) {
    if (!confirm("Are you sure you want to delete this expense?")) return;

    const res = await fetch(`/delete_expense/${id}`, {
        method: "DELETE"
    });

    const data = await res.json();
    if (data.error) {
        alert("Error: " + data.error);
    } else {
        loadExpenses();
    }
}

async function askAI() {
    const question = document.getElementById("question").value;
    const answerDiv = document.getElementById("aiAnswer");

    if (!question) {
        alert("Please enter a question");
        return;
    }

    answerDiv.innerText = "Thinking...";
    answerDiv.classList.add("active");

    const res = await fetch("/ask_ai", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
    });

    const data = await res.json();
    answerDiv.innerText = data.answer || data.error || "No answer received";
}

loadExpenses();
</script>

</body>
</html>
